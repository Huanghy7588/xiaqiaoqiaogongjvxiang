plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huanghy7588.xiaqiaoqiaogongjvxiang'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.huanghy7588.xiaqiaoqiaogongjvxiang"
        minSdk 21
        targetSdk 34
        // 版本号：每次发版递增，远程 JSON 里的 versionCode 需大于此值才会触发更新
        versionCode 6
        versionName "1.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // 复用调试密钥签名，minSdk 21 时 Gradle 会自动启用 v1+v2 双签名，兼容 Android 5.0+
            storeFile file("C:/Users/小米/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // 跳过 lint 检查（避免 SDK 访问问题）
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
}
